# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "83d27a18ca878791480d19d4f45d4d3c"
name = "Wrrapd"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  # orders/paid + orders/create need Protected Customer Data approval in Partner Dashboard
  # (Apps → Wrrapd → API access requests). Re-add after Shopify approves.
  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_orders,write_orders,read_shipping,write_shipping,read_checkouts,write_checkouts,write_order_edits"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[pos]
embedded = false
